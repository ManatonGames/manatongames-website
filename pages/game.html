<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game | Manaton Games</title>

    <!-- Styles -->

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/game.css">

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- =========================
     GAME PAGE
========================= -->

<section class="game-page">

    <div class="container">

        <!-- Back Button -->

        <a href="../index.html" class="play-btn">

            ← Back to Home

        </a>

        <!-- Banner -->

        <div class="game-banner">

            <img
                id="game-image"
                src="../assets/games/pd3.png"
                alt="Game Banner"
            >

        </div>

        <!-- Information -->

        <div class="game-information">

            <!-- Status -->

            <span
                id="game-status"
                class="game-status released"
            >

                🟢 Released

            </span>

            <!-- Stats -->

            <div class="game-stats">

                <span id="game-players">

                    👥 Coming Soon

                </span>

                <span id="game-visits">

                    👁️ Coming Soon

                </span>

            </div>

            <!-- Title -->

            <h1 id="game-title">

                Loading...

            </h1>

            <!-- Description -->

            <p id="game-description">

                Loading description...

            </p>

            <!-- Game Information -->

            <div class="game-details">

                <h3>Game Information</h3>

                <div class="details-grid">

                    <div class="detail-card">

                        <span>🎮 Genre</span>

                        <strong id="game-genre">

                            Loading...

                        </strong>

                    </div>

                    <div class="detail-card">

                        <span>👨‍💻 Developer</span>

                        <strong>

                            Manaton Games

                        </strong>

                    </div>

                    <div class="detail-card">

                        <span>👥 Max Players</span>

                        <strong id="game-maxplayers">

                            Loading...

                        </strong>

                    </div>

                    <div class="detail-card">

                        <span>📅 Status</span>

                        <strong id="game-status-text">

                            Loading...

                        </strong>

                    </div>

                    <div class="detail-card">

                        <span>🆔 Game ID</span>

                        <strong id="game-id">

                            Loading...

                        </strong>

                    </div>

                </div>

            </div>

            <!-- Screenshots -->

            <div class="game-gallery">

                <h3>Screenshots</h3>

                <div
                    id="game-screenshots"
                    class="gallery-grid"
                >

                    <!-- Images generated automatically -->

                </div>

            </div>

            <!-- Latest Update -->

            <div class="game-updates">

                <h3>Latest Update</h3>

                <div id="game-update">

                    Loading...

                </div>

            </div>

            <!-- Buttons -->

            <div class="game-buttons">

                <button
                    id="favorite-button"
                    class="favorite-btn"
                >

                    ❤️ Add to Favorites

                </button>

                <a
                    id="play-button"
                    href="#"
                    target="_blank"
                    class="btn-primary"
                >

                    🎮 Play on Roblox

                </a>

            </div>

        </div>

    </div>

</section>

<!-- Scripts -->

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/game.js"></script>

</body>

</html>
