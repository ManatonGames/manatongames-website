<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game | Manaton Games</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<section class="game-page">

    <div class="container">

        <a href="../index.html" class="play-btn">

            ← Back to Home

        </a>

        <div class="game-banner">

            <img
                id="game-image"
                src="../assets/games/pd3.png"
                alt="Game Banner"
            >

        </div>

        <div class="game-information">

            <span
    id="game-status"
    class="game-status released"
>

    🟢 Released

</span>

<div class="game-stats">

    <span id="game-players">

        👥 Coming Soon

    </span>

    <span id="game-visits">

        👁️ Coming Soon

    </span>

</div>

<h1 id="game-title">

    Loading...

</h1>

            <p id="game-description">

                Loading description...

            </p>

            <div class="game-details">

    <h3>Game Information</h3>

    <div class="details-grid">

        <div class="detail-card">

            <span>🎮 Genre</span>

            <strong id="game-genre">

                Loading...

            </strong>

        </div>

        <div class="detail-card">

            <span>👨‍💻 Developer</span>

            <strong>

                Manaton Games

            </strong>

        </div>

        <div class="detail-card">

            <span>👥 Max Players</span>

            <strong id="game-maxplayers">

                Loading...

            </strong>

        </div>

        <div class="detail-card">

            <span>📅 Status</span>

            <strong id="game-status-text">

                Loading...

            </strong>

        </div>

        <div class="detail-card">

            <span>🆔 Game ID</span>

            <strong id="game-id">

                Loading...

            </strong>

        </div>

    </div>

</div>

            <button
    id="favorite-button"
    class="favorite-btn"
>

    ❤️ Add to Favorites

</button>

<a

    id="play-button"

    href="#"

    target="_blank"

    class="btn-primary"

>

    🎮 Play on Roblox

</a>

        </div>

    </div>

</section>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/game.js"></script>

</body>

</html>
